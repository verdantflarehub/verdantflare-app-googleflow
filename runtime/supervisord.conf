[unix_http_server]
file=/run/user/1000/google-flow-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/user/1000/google-flow-supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
stdout_logfile=/tmp/google-flow-xvfb.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=TERM
autostart=true
autorestart=true
priority=10

[program:kasmvnc]
command=/usr/bin/Xvnc :1 -geometry 1920x1080 -depth 24 -interface 0.0.0.0 -websocketPort 48083 -publicIP 127.0.0.1 -httpd /usr/share/kasmvnc/www -DisableBasicAuth 1 -sslOnly 0 -SecurityTypes None -rfbport -1 -FrameRate 30 -DynamicQualityMin 5 -DynamicQualityMax 8 -AlwaysShared
stdout_logfile=/tmp/google-flow-kasmvnc.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stopsignal=TERM
autostart=false
autorestart=true
priority=30

[program:openbox]
command=bash -c "until [ -S /tmp/.X11-unix/X1 ]; do sleep 0.2; done; xsetroot -solid '#e8edf2' || true; exec /usr/bin/openbox"
environment=DISPLAY=":1"
stdout_logfile=/tmp/google-flow-openbox.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=TERM
autostart=false
autorestart=true
priority=35

[program:gateway]
command=/opt/google-flow/bin/google-flow-gateway
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=44
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:flow-login]
command=/opt/google-flow/bin/python -c 'import glob, json, os, pathlib; cfg = pathlib.Path(os.environ.get("XDG_RUNTIME_DIR", "/run/user/1000")) / "google-flow-login.json"; data = json.loads(cfg.read_text()) if cfg.is_file() else {}; home = data.get("home") or os.environ.get("GFLOW_CLI_HOME", "/data/google-flow/gflow"); proxy = data.get("proxy") or os.environ.get("GFLOW_CLI_BROWSER_PROXY", ""); matches = sorted(glob.glob(os.path.join(home, "profile_*"))); profile = matches[0] if matches else os.path.join(home, "profile_default"); pathlib.Path(profile).mkdir(parents=True, exist_ok=True); m = pathlib.Path(profile) / ".gflow_browser_strategy"; (m.write_text("chrome") if not m.exists() else None); t = pathlib.Path(home) / "config.toml"; (t.write_text("default_profile = \"default\"\n") if not t.exists() else None); args = ["/opt/google/chrome/chrome", f"--user-data-dir={profile}", "--start-maximized", "--no-first-run", "--no-default-browser-check", "--disable-dev-shm-usage", "https://flow.google.com/"]; args.insert(2, f"--proxy-server={proxy}") if proxy else None; os.execv(args[0], args)'
environment=DISPLAY=":1"
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/google-flow-chrome.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true
