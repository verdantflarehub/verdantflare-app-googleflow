[unix_http_server]
file=/run/user/1000/google-flow-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/user/1000/google-flow-supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
stdout_logfile=/tmp/google-flow-xvfb.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=TERM
autostart=true
autorestart=true
priority=10

[program:kasmvnc]
command=/usr/bin/Xvnc :1 -geometry 1920x1080 -depth 24 -interface 0.0.0.0 -websocketPort 48083 -publicIP 127.0.0.1 -httpd /usr/share/kasmvnc/www -DisableBasicAuth 1 -sslOnly 0 -SecurityTypes None -rfbport -1 -FrameRate 30 -DynamicQualityMin 5 -DynamicQualityMax 8 -AlwaysShared
stdout_logfile=/tmp/google-flow-kasmvnc.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stopsignal=TERM
autostart=false
autorestart=true
priority=30

[program:openbox]
command=bash -c "until [ -S /tmp/.X11-unix/X1 ]; do sleep 0.2; done; xsetroot -solid '#e8edf2' || true; exec /usr/bin/openbox"
environment=DISPLAY=":1"
stdout_logfile=/tmp/google-flow-openbox.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=TERM
autostart=false
autorestart=true
priority=35

[program:gateway]
command=/opt/google-flow/bin/google-flow-gateway
directory=/app
environment=DISPLAY=":99"
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=44
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:flow-login]
command=bash -c 'PROFILE=$(ls -d /data/google-flow/gflow/profile_* 2>/dev/null | head -n 1); PROFILE=${PROFILE:-/data/google-flow/gflow/profile_default}; exec /opt/google/chrome/chrome --user-data-dir="$PROFILE" --proxy-server="$GFLOW_CLI_BROWSER_PROXY" --start-maximized --no-first-run --no-default-browser-check --disable-dev-shm-usage "https://flow.google.com/"'
environment=DISPLAY=":1"
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/google-flow-chrome.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true
