[unix_http_server]
file=/run/user/1000/google-flow-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodaemon=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/user/1000/google-flow-supervisor.sock

[program:dbus-session]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; mkdir -pm700 \"${XDG_RUNTIME_DIR}\"; rm -f \"${XDG_RUNTIME_DIR}/bus\"; dbus-daemon --session --nofork --nopidfile --address=\"${DBUS_SESSION_BUS_ADDRESS}\""
stdout_logfile=/tmp/google-flow-dbus-session.log
redirect_stderr=true
stopasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=1

[program:dbus-system]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; sudo mkdir -pm755 /run/dbus; sudo rm -f /run/dbus/system_bus_socket; sudo dbus-daemon --system --nofork --nopidfile --nosyslog --address=\"${DBUS_SYSTEM_BUS_ADDRESS}\""
stdout_logfile=/tmp/google-flow-dbus-system.log
redirect_stderr=true
stopasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=1

[program:pipewire]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ]; do sleep 0.5; done; exec /usr/bin/pipewire"
stdout_logfile=/tmp/google-flow-pipewire.log
redirect_stderr=true
stopasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=10

[program:wireplumber]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/wireplumber"
stdout_logfile=/tmp/google-flow-wireplumber.log
redirect_stderr=true
stopasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=11

[program:pipewire-pulse]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/pipewire-0\" ]; do sleep 0.5; done; exec /usr/bin/pipewire-pulse"
stdout_logfile=/tmp/google-flow-pipewire-pulse.log
redirect_stderr=true
stopasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=12

[program:smithay-display]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; exec /etc/beagle-wind-vnc/start-smithay-display.sh"
stdout_logfile=/tmp/google-flow-smithay.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=15

[program:kwin-wayland]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; until [ -S \"${XDG_RUNTIME_DIR}/bus\" ] && [ -r \"${BDWIND_SMITHAY_READY_FILE}\" ] && [ -S \"${BDWIND_SMITHAY_CONTROL_SOCKET}\" ]; do sleep 0.2; done; exec /etc/beagle-wind-vnc/start-kwin-wayland.sh"
stdout_logfile=/tmp/google-flow-kwin.log
redirect_stderr=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3
stopsignal=INT
autostart=false
autorestart=true
priority=20

[program:start-webrtc]
command=bash -c ". /etc/beagle-wind-vnc/runtime-env.sh; . /opt/gstreamer/gst-env; exec /usr/bin/python3 /app/runtime/webrtc-run.py"
stdout_logfile=/tmp/google-flow-webrtc.log
redirect_stderr=true
stopasgroup=true
stopsignal=INT
autostart=false
autorestart=true
stopwaitsecs=5
killasgroup=true
priority=50

[program:gateway]
command=/opt/google-flow/bin/google-flow-gateway
directory=/app
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=44
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:flow-login]
command=/opt/google-flow/bin/gflow auth login --browser chrome
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
redirect_stderr=true
