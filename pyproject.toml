[project]
name = "verdantflare-app-googleflow"
version = "0.3.7"
requires-python = ">=3.11"
dependencies = [
  "gflow-cli==0.103.1", "mcp==2.3.0", "httpx==0.28.1", "httpx2==2.16.2",
  "pydantic==2.13.4", "starlette==1.3.1", "uvicorn==0.52.1", "Pillow==12.3.0",
]

[project.scripts]
google-flow-gateway = "google_flow_gateway.runtime:main"

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["google_flow_gateway*"]
