<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google Flow · 会员渠道管理</title><link rel="stylesheet" href="./dashboard.css"></head>
<body><main class="main" id="dashboard">
<header class="context"><div class="gf-head-row"><div><p class="subline" id="breadcrumb">应用中心 / 渠道管理 / Google Flow</p><h1 id="page-title">Google Flow</h1></div><div class="actions" id="head-actions"></div></div></header>
<nav id="tabs" class="tabs" aria-label="渠道管理"></nav><p id="notice" role="status"></p>
<section id="content" aria-live="polite"></section>
<dialog id="confirm"><form method="dialog"><h2 id="question"></h2>
<label id="media-label" hidden>Flow 媒体 ID <input id="media"></label>
<div class="actions g-space"><button value="cancel">取消</button><button value="yes" class="gf-primary">确认</button></div></form></dialog>
<dialog id="acct-dialog"><form id="acct-form" class="gf-dialog-form"><h2 id="acct-dialog-title">新增账号</h2>
<input type="hidden" name="id" id="acct-id">
<label class="gf-field"><span class="gf-field-label">账号名称</span><input required name="label" id="acct-label" maxlength="64" placeholder="例如：备用 Ultra 账号"></label>
<label class="gf-field"><span class="gf-field-label">调度优先级<span class="gf-field-unit">1–999，越小越优先</span></span><input required type="number" min="1" max="999" step="1" name="priority" id="acct-priority" value="100"></label>
<label class="gf-field"><span class="gf-field-label">代理出口<span class="gf-field-unit">读取系统「网络出口」</span></span><select name="proxy_ref" id="acct-proxy"><option value="default">默认出口（系统默认 :1082）</option></select><small>从系统「网络出口」选择该账号专用代理；修改运行中账号的代理需等待其任务完成。</small></label>
<label class="c-check" id="acct-enabled-wrap" hidden><input type="checkbox" name="enabled" id="acct-enabled" checked> 启用该账号参与自动调度</label>
<div class="actions g-space"><button type="button" id="acct-cancel">取消</button><button type="submit" class="gf-primary">保存</button></div></form></dialog>
</main>
<script type="module" src="./dashboard.mjs"></script></body></html>
